---

- name: Load OS-specific vars
  ansible.builtin.include_vars: "{{ lookup('first_found', params) }}"
  vars:
    params:
      files:
        - "{{ ansible_distribution }}.yml"
        - "{{ ansible_os_family }}.yml"
        - Default.yml
      paths:
        - vars

- name: Install software dependencies
  ansible.builtin.package:
    name: "{{ vault_dep_packages }}"
    state: present

- name: "Download vault binary ({{ vault_src | basename }})"
  ansible.builtin.get_url:
    url: "{{ vault_src }}"
    checksum: "{{ vault_chksum }}"
    dest: "/tmp/{{ vault_src | basename }}"
    force: yes
    owner: root
    group: root
  when: not vault_skip_download

- name: "Unzip vault binary ({{ vault_src | basename }})"
  ansible.builtin.unarchive:
    src: "/tmp/{{ vault_src | basename }}"
    remote_src: yes
    dest: "{{ vault_bin_path }}"
    creates: "{{ vault_bin_path }}/vault"
    owner: root
    group: root
    mode: "0755"
    keep_newer: true

- name: Create vault group
  ansible.builtin.group:
    name: "{{ vault_group }}"
    gid: "{{ vault_gid }}"
    state: present

- name: Create vault user
  ansible.builtin.user:
    name: "{{ vault_user }}"
    group: "{{ vault_group }}"
    uid: "{{ vault_uid }}"
    comment: vault systemd service user
    shell: /sbin/nologin
    system: yes
    state: present

- name: Create vault directory structures
  ansible.builtin.file:
    path: "{{ item }}"
    owner: "{{ vault_user }}"
    group: "{{ vault_group }}"
    mode: "0750"
    state: directory
  loop:
    - "{{ vault_conf | dirname }}"
    - "{{ vault_certs }}"
    - "{{ vault_data_path }}"

- name: Install python3-pip
  ansible.builtin.package:
    name: "{{ vault_pip_packages }}"
    state: present
    update_cache: yes

- name: Install pip into a virtual environment
  ansible.builtin.pip:
    name: pip
    state: latest
    virtualenv: "{{ vault_venv_path }}"
    virtualenv_command: "{{ discovered_interpreter_python }} -m venv"

- name: TLS block
  vars:
    ansible_python_interpreter: "{{ vault_venv_path }}/bin/python"
  block:

    - name: Install python cryptography dependencies
      ansible.builtin.pip:
        name: "{{ item }}"
        virtualenv: "{{ vault_venv_path }}"
      loop:
        - cryptography

    - name: Generate OpenSSL private key pem file
      community.crypto.openssl_privatekey:
        path: "{{ vault_privkey }}"
        owner: "{{ vault_user }}"
        group: "{{ vault_group }}"
        mode: "0600"

    - name: Generate an OpenSSL CSR
      community.crypto.openssl_csr:
        path: "{{ vault_csr }}"
        owner: "{{ vault_user }}"
        group: "{{ vault_group }}"
        mode: "0644"
        privatekey_path: "{{ vault_privkey }}"
        common_name: "{{ vault_cn }}"
        country_name: "{{ vault_cc }}"
        organization_name: "{{ vault_on }}"

    - name: Generate a Self-Signed OpenSSL certificate
      community.crypto.x509_certificate:
        path: "{{ vault_certfile }}"
        owner: "{{ vault_user }}"
        group: "{{ vault_group }}"
        mode: "0644"
        privatekey_path: "{{ vault_privkey }}"
        csr_path: "{{ vault_csr }}"
        provider: selfsigned

    - name: Read TLS certificate file
      ansible.builtin.slurp:
        path: "{{ vault_certfile }}"
      register: cert_slurp

    - name: Copy TLS certificates to all other vault hosts
      ansible.builtin.copy:
        dest: "{{ hostvars[vault_host]['cert_slurp']['source'] }}"
        content: "{{ hostvars[vault_host]['cert_slurp']['content'] | b64decode }}"
        owner: "{{ vault_user }}"
        group: "{{ vault_group }}"
        mode: "0644"
      loop: "{{ ansible_play_hosts | reject('equalto', inventory_hostname) | list }}"
      loop_control:
        loop_var: vault_host

  when: not vault_tls_disable | default(false) | bool

- name: Create vault server configuration
  ansible.builtin.template:
    src: config.j2
    dest: "{{ vault_conf }}"
    owner: "{{ vault_user }}"
    group: "{{ vault_group }}"
    mode: "0640"

- name: Create vault systemd service config
  ansible.builtin.template:
    src: service.j2
    dest: "/etc/systemd/system/{{ vault_service }}.service"
    owner: root
    group: root
    mode: "0664"

- name: Start and enable vault systemd service
  ansible.builtin.systemd:
    name: "{{ vault_service }}"
    daemon_reload: yes
    state: started
    enabled: yes

- name: Set VAULT_ADDR listener in profile
  ansible.builtin.template:
    src: profile.j2
    dest: /etc/profile.d/vault.sh
    owner: root
    group: root
    mode: "0755"
